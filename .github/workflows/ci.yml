name: Offline validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.2'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: python -m pytest tests -q
      - name: Validate dbt project without connecting to AWS
        env:
          GOLD_DATABASE: b3_lakehouse_gold
          ATHENA_RESULTS_URI: s3://offline-validation/athena-results/
          GOLD_DATA_URI: s3://offline-validation/gold/
          ATHENA_WORKGROUP: b3-lakehouse-aws-gold
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        run: |
          python -m venv local/dbt-ci
          local/dbt-ci/bin/pip install -r dbt/requirements.txt
          local/dbt-ci/bin/dbt parse --project-dir dbt --profiles-dir dbt --no-partial-parse
      - name: Build gold container without publishing or running it
        run: docker build -t b3-gold-ci dbt
      - run: python scripts/build_bronze.py
      - run: python scripts/build_silver.py
      - run: |
          python -m pip install --only-binary=:all: --no-compile --target local/history-sdk -r scripts/requirements-history.txt
      - run: python scripts/build_history.py
      - run: terraform fmt -check -recursive infra
      - name: Validate and mock-test without AWS access
        shell: bash
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra/modules/budget infra/modules/bronze infra/modules/silver infra/modules/history infra/modules/history-glue infra/modules/gold infra/environments/dev; do
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
          done
          terraform -chdir=infra/bootstrap test
          terraform -chdir=infra/modules/budget test
          terraform -chdir=infra/modules/bronze test
          terraform -chdir=infra/modules/silver test
          terraform -chdir=infra/modules/history test
          terraform -chdir=infra/modules/history-glue test
          terraform -chdir=infra/modules/gold test

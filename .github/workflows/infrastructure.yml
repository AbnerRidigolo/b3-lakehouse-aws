name: Reviewed infrastructure
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, destroy]
        default: plan
      confirmation:
        description: 'For destruction type DESTROY b3-lakehouse-aws'
        type: string
permissions:
  contents: read
concurrency:
  group: aws-dev-infrastructure
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
  TF_VAR_project_start: ${{ vars.PROJECT_START }}
  TF_VAR_project_end: ${{ vars.PROJECT_END }}
jobs:
  plan:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' || inputs.operation != 'destroy' ||
      (github.ref == 'refs/heads/main' && inputs.confirmation == 'DESTROY b3-lakehouse-aws'))
    environment: aws-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.2'
      - name: Offline checks before AWS authentication
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          terraform fmt -check -recursive infra
          for dir in infra/bootstrap infra/modules/budget; do
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
      - name: Initialize and validate
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform -chdir=infra/environments/dev init -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=dev/terraform.tfstate" -backend-config="region=$REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform -chdir=infra/environments/dev validate
      - name: Create reviewable plan
        env:
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$OPERATION" == "destroy" ]]; then flags+=(-destroy); fi
          terraform -chdir=infra/environments/dev plan -lock-timeout=120s "${flags[@]}" -out=reviewed.tfplan
          echo 'Review this run plan and cost estimate before approving aws-apply. Budget is an alert, not a hard limit.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-plan
          path: infra/environments/dev/reviewed.tfplan
          retention-days: 1
  apply:
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy' && inputs.confirmation == 'DESTROY b3-lakehouse-aws'))
    environment: aws-apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.2'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-plan
          path: infra/environments/dev
      - name: Apply the exact reviewed plan
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform -chdir=infra/environments/dev init -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=dev/terraform.tfstate" -backend-config="region=$REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform -chdir=infra/environments/dev apply -lock-timeout=120s reviewed.tfplan
